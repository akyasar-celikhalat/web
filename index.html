<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.tailwindcss.com;">
  <title>Hesaplama Portalı</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    *, *::before, *::after { 
      box-sizing: border-box !important; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none !important;
      -webkit-user-select: none !important;
    }
    
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden !important;
      background-color: var(--bg); 
      color: var(--text); 
      min-height: 100vh;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 20px;
      padding-bottom: 40px;
    }

    .app-container { 
      width: 100%; 
      max-width: 500px; 
      padding: 16px; 
      box-sizing: border-box;
    }

    header { 
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); 
      color: white; 
      padding: 20px; 
      border-radius: 16px; 
      margin-bottom: 20px; 
      text-align: center; 
      box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.2); 
    }
    header h1 { font-size: 1.35rem; font-weight: 800; tracking: -0.02em; }
    header p { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; font-weight: 500; }

    .module-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 14px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
    }

    .module-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      border-color: var(--primary-light);
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1e40af;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>Hesaplama Portalı</h1>
    <p>Geliştiren: Yaşar AK</p>
  </header>

  <div id="modules-list" class="flex flex-col">
    <!-- Dynamic Cards Rendered From Config -->
  </div>

  <div class="mt-8 text-center text-xs text-slate-400">
    <p>© 2026 Tüm Hakları Saklıdır. Güvenli Hesaplama Sistemi.</p>
  </div>
</div>

<script src="js/security.js"></script>
<script src="js/app-config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const listContainer = document.getElementById('modules-list');
    listContainer.innerHTML = '';

    APP_PAGES.forEach(page => {
      const card = document.createElement('a');
      card.href = page.url;
      card.className = 'module-card';
      card.innerHTML = `
        <div class="flex items-start gap-3.5">
          <div class="p-3 bg-blue-50 text-blue-900 rounded-xl mt-0.5">
            <i data-lucide="${page.icon}" class="w-6 h-6"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h2 class="font-bold text-slate-800 text-sm">${page.title}</h2>
              <span class="badge">${page.badge}</span>
            </div>
            <p class="text-xs text-slate-500 mt-1 leading-relaxed">${page.description}</p>
          </div>
        </div>
        <div class="text-slate-400 pl-2">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </div>
      `;
      listContainer.appendChild(card);
    });

    lucide.createIcons();
  });
</script>
</body>
</html>
